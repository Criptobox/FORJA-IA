name: Build Forja IA OpenCode Android
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install extraction tools
        run: sudo apt-get update && sudo apt-get install -y binutils xz-utils
      - name: Fetch PRoot ARM64 libraries
        working-directory: android/forja-opencode
        run: python3 scripts/fetch_proot.py
      - name: Verify generated PRoot assets
        working-directory: android/forja-opencode
        run: |
          test -s app/src/main/assets/proot_libs.txt
          test -s app/src/main/jniLibs/arm64-v8a/libproot.so
          test -s app/src/main/jniLibs/arm64-v8a/libproot-loader.so
      - name: Build APK
        working-directory: android/forja-opencode
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: forja-opencode-runtime-debug-apk
          path: android/forja-opencode/app/build/outputs/apk/debug/app-debug.apk
