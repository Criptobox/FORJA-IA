name: APK Android

# Compila la app Android (android/forja-app) en cada cambio: la interfaz
# exportada en estático + llama.cpp nativo para arm64. Desde main, además, la
# publica en la release «android-latest», que es de donde la propia app se
# actualiza («Buscar actualización» en Ajustes → Proveedores → Modelo nativo).

on:
  push:
    branches: [main, "ccr-*"]
    paths:
      - "src/**"
      - "public/**"
      - "android/forja-app/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "scripts/build-android-web.mjs"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

env:
  # Versión fijada de llama.cpp: un cambio de versión es un cambio de código.
  LLAMA_CPP_TAG: b12020

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependencias
        run: npm ci --no-audit --no-fund

      - name: Interfaz estática (sin rutas de servidor)
        run: node scripts/build-android-web.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Caché de llama-server
        id: cache-llama
        uses: actions/cache@v4
        with:
          path: build-llama/bin/llama-server
          key: llama-server-android-arm64-${{ env.LLAMA_CPP_TAG }}-v2

      - name: Compilar llama-server para Android (arm64)
        if: steps.cache-llama.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$LLAMA_CPP_TAG" https://github.com/ggml-org/llama.cpp llama.cpp
          # dotprod + fp16: cualquier móvil de 2018 en adelante (Cortex-A75+)
          # los tiene, y multiplican la velocidad de los modelos cuantizados.
          cmake -S llama.cpp -B build-llama \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_LLAMAFILE=OFF \
            -DLLAMA_OPENSSL=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TOOLS=ON \
            -DLLAMA_BUILD_SERVER=ON \
            -DCMAKE_C_FLAGS="-march=armv8.2-a+dotprod+fp16" \
            -DCMAKE_CXX_FLAGS="-march=armv8.2-a+dotprod+fp16"
          cmake --build build-llama --config Release --target llama-server -j "$(nproc)"
          # Sin símbolos de depuración: 168 MB → unos pocos. Gradle no sabe
          # quitárselos a un ejecutable («Unable to strip»), así que aquí.
          "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-unneeded build-llama/bin/llama-server
          file build-llama/bin/llama-server
          ls -la build-llama/bin/llama-server

      - name: Montar assets y binario nativo
        run: |
          APP=android/forja-app/app/src/main
          mkdir -p "$APP/assets/web" "$APP/jniLibs/arm64-v8a"
          cp -r out/. "$APP/assets/web/"
          # Android solo deja ejecutar lo que está en nativeLibraryDir, y solo
          # extrae ahí archivos «lib*.so».
          cp build-llama/bin/llama-server "$APP/jniLibs/arm64-v8a/libllama-server.so"
          du -sh "$APP/assets/web" "$APP/jniLibs/arm64-v8a/libllama-server.so"

      - name: Clave de firma (secreto del repo)
        env:
          FORJA_KEYSTORE_B64: ${{ secrets.FORJA_KEYSTORE_B64 }}
          FORJA_KEYSTORE_PASS_SECRETO: ${{ secrets.FORJA_KEYSTORE_PASS }}
        run: |
          # La clave no está en el repo (es público): solo en los secretos.
          if [ -n "$FORJA_KEYSTORE_B64" ] && [ -n "$FORJA_KEYSTORE_PASS_SECRETO" ]; then
            echo "$FORJA_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/forja.jks"
            echo "FORJA_KEYSTORE=$RUNNER_TEMP/forja.jks" >> "$GITHUB_ENV"
            echo "FORJA_KEYSTORE_PASS=$FORJA_KEYSTORE_PASS_SECRETO" >> "$GITHUB_ENV"
            echo "FIRMA_ESTABLE=1" >> "$GITHUB_ENV"
            echo "Firmando con la clave de los secretos."
          else
            echo "FIRMA_ESTABLE=0" >> "$GITHUB_ENV"
            echo "::warning::Faltan los secretos FORJA_KEYSTORE_B64 y FORJA_KEYSTORE_PASS: APK de prueba firmada con una clave temporal. No se publica en la release (no se podría instalar encima de la anterior)."
          fi

      - name: Versión
        run: |
          echo "FORJA_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "FORJA_VERSION_NAME=$(node -p "require('./package.json').version")-a${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Compilar la APK
        working-directory: android/forja-app
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renombrar y comprobar lo que lleva dentro
        run: |
          cp android/forja-app/app/build/outputs/apk/release/app-release.apk forja-ia.apk
          ls -la forja-ia.apk
          # Sin esto, una APK que abre la interfaz en blanco pasaba como buena.
          for f in assets/web/index.html assets/web/_next/static lib/arm64-v8a/libllama-server.so; do
            if ! unzip -l forja-ia.apk | grep -q " $f"; then
              echo "::error::La APK no lleva $f"
              exit 1
            fi
          done
          echo "Archivos de _next/ en la APK: $(unzip -l forja-ia.apk | grep -c ' assets/web/_next/')"

      - uses: actions/upload-artifact@v4
        with:
          name: forja-ia-${{ env.FORJA_VERSION_NAME }}
          path: forja-ia.apk

      - name: Publicar en la release android-latest
        if: github.ref == 'refs/heads/main' && env.FIRMA_ESTABLE == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTAS="Forja IA para Android, compilada desde ${GITHUB_SHA::7}.
          Se actualiza sola desde Ajustes → Proveedores → Modelo nativo → Buscar actualización.

          versionCode=${FORJA_VERSION_CODE}
          versionName=${FORJA_VERSION_NAME}"
          if ! gh release view android-latest >/dev/null 2>&1; then
            gh release create android-latest --title "Forja IA ${FORJA_VERSION_NAME} (Android)" \
              --notes "$NOTAS" --prerelease --target "$GITHUB_SHA"
          else
            gh release edit android-latest --title "Forja IA ${FORJA_VERSION_NAME} (Android)" --notes "$NOTAS"
          fi
          gh release upload android-latest forja-ia.apk --clobber
